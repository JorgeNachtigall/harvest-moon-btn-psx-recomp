# ---------------------------------------------------------------------------
# FRUSTUM CONE: d = +60. Fills the 16:9 edge wedges. See docs/FRUSTUM.md.
# Safe to ship only because the packet buffer above is now 192,000 bytes --
# d=60 peaks at 100,532 B, which overran the stock 96,000-byte buffer and was
# the crash. Measured now: 52.4% occupancy, 16.667 ms avg.
# To retune d, recompute BOTH replacements together (docs/FRUSTUM.md section 1).
# ---------------------------------------------------------------------------


# ---------------------------------------------------------------------------
# FRUSTUM CONE: d = +8.  Fills the 16:9 edge wedges.  See docs/FRUSTUM.md.
#
# d = 8 was chosen ON SCREEN as the smallest value that closes the wedges, and
# it matters that it is small: the cost of this knob is frame rate, and it is
# NOT free the way earlier notes in this repo claimed.  Measured on the
# graveyard save (a heavy scene, ~1,500 draws/frame at stock):
#
#     d=0  -> 29.97 game FPS,  1,642 draws/frame
#     d=40 -> 19.89 game FPS,  1,955 draws/frame
#     d=60 -> 25.45 game FPS,  2,236 draws/frame   (straddles 30 and 20)
#
# The game renders on whole vblanks (VSync), so the frame rate is quantised:
# a scene that no longer fits in two vblank periods drops straight from 30 to
# 20.  Heavy areas sit right on that boundary at stock, which is why a large d
# costs a third of the frame rate there while costing nothing in town.
#
# Read `game_fps` from `frame_perf`, never `vsync_hz` -- the runtime presents
# at every simulated vblank, so vsync is pinned at 60 no matter what the game
# is doing.  Tune this live with `python3 tools/frustum_d.py` (needs a build
# with these two patches REMOVED; see docs/FRUSTUM.md section 2).
# ---------------------------------------------------------------------------

[[recompiler.patch]]
id          = "widescreen-frustum-cone-h0"
address     = "0x8001D45C"
expected    = "0x8E0491E0"   # lw a0,angle[0] from 0x800491E0
replacement = "0x24040874"   # addiu a0,zero,2164   (2156 + d, d = 8)
note        = "Frustum cone: widen the horizontal half-plane by d=8"

[[recompiler.patch]]
id          = "widescreen-frustum-cone-h1"
address     = "0x8001D4A4"
expected    = "0x8E040004"   # lw a0,angle[1] from 0x800491E0
replacement = "0x2404FF8C"   # addiu a0,zero,-116   (-108 - d, d = 8)
note        = "Frustum cone: mirror side, same d. Vertical angles stay stock."

[runtime]
# Load precompiled overlay shared objects from cache/<game_id>/ ahead of the
# dirty-RAM interpreter, and record overlay bytes to overlay_captures.json.
overlay_cache = true

# Append every changed coherent snapshot to overlay_captures.addendum.jsonl so
# a hard kill cannot destroy earlier records.
overlay_capture_history = true

[video]
# Native widescreen. The runtime renders a genuinely wider internal frame
# (426x240 at 16:9) rather than squashing and stretching a 4:3 one -- the extra
# horizontal field of view is real rendered pixels. Verified: 426x240 present,
# correct proportions, ~60 fps.
aspect_ratio = "16:9"

[widescreen]
# REQUIRED, and the single key that makes any of this take effect. The wide
# compositor only engages on frames classified as gameplay; without a
# classifier every frame is treated as full-2D and pillarboxed back to 4:3.
# Before this was set, gpu_state reported mode 2 selected but game_mode 0 /
# present_native_43 1 -- i.e. widescreen configured and doing nothing.
# Harvest Moon projects real geometry through the GTE (~2900 verts/frame), so
# the generic GTE-activity classifier applies.
gte_game_mode = true

# Keep it wide on the PAUSE MENU (and every other in-game 2D screen).
#
# THE PROBLEM. gte_game_mode classifies a frame as gameplay by counting GTE
# projections, and holds that verdict for WS_GTE_GAME_MODE_HYSTERESIS = 45
# frames (~0.75 s) after the last 3D frame. That rides out a sparse cutscene
# frame, but the pause menu is pure 2D and projects ZERO verts for as long as
# it is open, so after 45 frames game_mode flips to 0, present_native_43 to 1,
# and the menu pillarboxes back to 4:3 with black bars.
#
# That also silently wasted the menu-wallpaper widening above: FUN_800223D4's
# tile loop is patched to cover the 16:9 frame, but a pillarboxed present
# throws those extra tiles away off-screen.
#
# THE FIX. ws_game_mode() consults a RAM gate FIRST and returns its verdict
# verbatim when configured (gpu.c, ws_gameplay_state_matches), bypassing the
# GTE heuristic entirely. Harvest Moon already keeps exactly the variable we
# need: 0x8005E39C, the game mode that FUN_80011370 switches on to pick the
# overlay member (see seeds/overlays.json). It is a 32-bit word, which is what
# the gate reads with psx_read_word -- verified, the three bytes above it are
# zero.
#
# Measured:            title screen  mode 0x0D  ->  4:3   (member 27)
#                      gameplay      mode 0x02  ->  wide  (member 11)
#                      pause menu    mode 0x02  ->  wide  (member 11)
#
# The pause menu shares the gameplay mode, so gating on the mode holds the wide
# present across it while the title and the other front-end screens still get a
# faithful 4:3 pillarbox.
#
# The value list is every mode that loads member 11 -- objcg\event_s.bin, the
# world/event overlay -- into window A, straight from seeds/overlays.json.
# Mode 15 also maps to member 11 but loads it into window B and is marked
# `unverified` there, so it is deliberately NOT listed.
#
# gte_game_mode above stays TRUE: the gate supersedes it for game_mode, but
# ws_2d_only_scene() still keys off it (it returns 0 early when the GTE
# detector is configured), and without that a 2D-only scene would pillarbox
# through the other branch of gpu_ws_present_native_43.
#
# NOTE: this is a [widescreen] key, so it is part of the overlay codegen config
# hash. After editing, rerun the full three-step regen or the overlay cache is
# orphaned and everything falls back to the interpreter, silently. See CLAUDE.md.
gameplay_state_addr   = "0x8005E39C"
gameplay_state_values = ["0x02", "0x06", "0x0E", "0x13", "0x14"]

[widescreen.cull]
# ---------------------------------------------------------------------------
# The 3D world renderer's screen-space culls.  See docs/RENDERING.md §2 for the
# full anatomy and docs/METHOD.md for how they were found.
#
# FUN_8001C37C draws the ground and world geometry. Per primitive it runs
# RTPT -> GTE FLAG check -> NCLIP backface -> a SCREEN-BOUNDS TEST, and emits
# only when that test returns non-zero.
#
# It has TWO bounds helpers, and both hardcode the 4:3 width:
#
#   FUN_8001D21C  3 vertices, called at 0x8001C4B4/C638/C7CC/C964
#   FUN_8001D2D8  4 vertices, called at 0x8001CB54/CD2C/CF14/D100
#
# Both compute (X + 0x13) & 0xFFFF per vertex and keep the primitive when any
# vertex is below 0x153 (= 320 + 0x13, the 4:3 display width). That is why
# geometry pops into view exactly as it touches the original screen edge.
#
# Forcing the FIRST comparison of each chain to 1 makes the helper report
# "on screen" immediately. Guarded twice over: the recompiler verifies each
# instruction word and fails closed on a mismatch, and the widened verdict
# applies only while a wide view is engaged, so 4:3 is byte-identical.
#
# Measured, savestate slot 1 at 16:9:
#   before  left-margin black 0.075  right 0.273  whole frame 0.043
#   after   left-margin black 0.002  right 0.000  whole frame 0.000
# ---------------------------------------------------------------------------

# --- FUN_8001D21C (3-vertex) --- Verified by tracing
# writes to the packet buffer during a cutscene: FUN_8001C37C (0x8001C37C)
# builds the packets and, after RTPT + NCLIP backface rejection, calls
# FUN_8001D21C with the three projected screen coords, drawing only when it
# returns non-zero (call sites 0x8001C4B4/C638/C7CC/C964).
#
# That test hardcodes the 4:3 width. Per vertex it computes (X + 0x13) & 0xFFFF:
#   sltiu ..., 0x1A3   early-out: reject when all three are beyond ~x=400
#   sltiu ..., 0x153   keep when any vertex has x < 320   (0x153 = 320 + 0x13)
# Forcing the first comparison of each chain to 1 makes it always report "on
# screen". Guarded twice over: the recompiler verifies the instruction word at
# each address and fails closed on mismatch, and the widened verdict applies
# only while a wide view is engaged, so 4:3 behaviour is unchanged.
#
# On its own this moved the cutscene farm only slightly (right-margin black
# 0.493 -> 0.481): the ground flows through the 4-vertex helper below, not this
# one. Both are needed.
[[widescreen.cull.keep]]
address  = "0x8001D230"   # sltiu v0,v0,0x1A3 -- skip the all-three-off-screen early-out
expected = "0x2C4201A3"
result   = 1

[[widescreen.cull.keep]]
address  = "0x8001D290"   # sltiu v0,v0,0x153 -- report the first vertex as on-screen
expected = "0x2C420153"
result   = 1

# THE GAMEPLAY GROUND CULL. FUN_8001C37C has TWO screen-bounds helpers, not one:
#   FUN_8001D21C (3-vertex) called at 0x8001C4B4/C638/C7CC/C964
#   FUN_8001D2D8 (4-vertex) called at 0x8001CB54/CD2C/CF14/D100   <-- this one
# Only the first was patched originally, which is why gameplay never changed.
#
# Found by working backwards from pixels: rasterising one frame identified the
# primitive covering a known grass pixel (src 0x001C2B2C), and tracing writes to
# that exact packet gave writer PCs 0x8001CE58/CF38/CFB4 with ra=0x8001CF1C --
# the return address of the FUN_8001D2D8 call at 0x8001CF14.
#
# Same 4:3 hardcoding: per vertex (X + 0x13) & 0xFFFF < 0x153 (= 320 + 0x13).
# It has no early-out, so forcing the first comparison to 1 returns "visible"
# immediately. Gated: applies only while a wide view is engaged.
[[widescreen.cull.keep]]
address  = "0x8001D2E8"   # sltiu v0,v0,0x153 -- 4-vertex bounds test, first vertex
expected = "0x2C420153"
result   = 1
