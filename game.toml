# Harvest Moon: Back to Nature (USA) — SLUS-01115
#
# All paths are relative to this repository's root (the recompiler walks up
# from this file to the first directory containing .git/.gitignore/CMakeLists.txt).
#
# The [game] header values were read out of the PS-X EXE header and confirmed
# against the entry-point BSS-clear loop (zeroes 0x8005E378..0x800B7E20),
# disassembled and verified in Ghidra.

[game]
name         = "Harvest Moon: Back to Nature"
id           = "SLUS-01115"
region       = "NTSC-U"
exe          = "SLUS_011.15"
disc         = "Harvest Moon - Back to Nature (USA).cue"
load_address = "0x80010000"
entry_pc     = "0x80011278"
text_size    = "0x0004E800"
stack_base   = "0x801FFFF0"

[recompiler]
# 946 Ghidra function starts + 8 pointer-table targets recovered by scanning the
# data region; see seeds/pointer_table_seeds.json for the evidence behind each.
seeds       = "seeds/functions.txt"
out_dir     = "generated"
strict      = true
discovery   = "whole-image"

# Address model the game codegen folds BIOS RAM aliases through. OpenBIOS is
# the backend this project builds; the retail SCPH1001 profile points at a ROM
# most people will not have.
#
# NOTE: the overlay compile path currently IGNORES this key — bios_profile_path
# is populated only from --config, while tools/compile_overlays.py invokes the
# recompiler with --ws-config. It falls back to searching for
# <subdir>/bios/SCPH1001.toml relative to this file's directory, which resolves
# to psxrecomp/bios/SCPH1001.toml in this layout. That is why the framework must
# live at ./psxrecomp and not somewhere else.
bios_config = "psxrecomp/bios/OpenBIOS.toml"

# ---------------------------------------------------------------------------
# Widescreen: widen the MENU WALLPAPER tile-grid loop.  [VERIFIED WORKING]
#
# FUN_800223D4 (0x800223D4) draws the tiled menu/pause background as a grid of
# 24px tiles via a
# callback, bounded to the ORIGINAL 320x240 screen plus one tile of slack:
#
#   s0 = -0xC                     start X, one tile left of screen
#   s0 += 0x18                    24px tile step
#   while (s0 < 0x158)            X bound = 344 = 320 + 24
#   while (a1 < 0x108)            Y bound = 264 = 240 + 24
#
# Confirmed in play: with these patches the wallpaper now fills the widened
# frame instead of stopping at the 4:3 edge. (It is NOT the gameplay ground --
# that is drawn elsewhere and was unaffected; gameplay primitive counts stayed
# at ~291 and the margins did not change.)
#
# 16:9 at 320 wide reveals 53px per side; rounded up to whole 24px tiles that
# is 72px = 3 tiles. So start 3 tiles earlier and end 3 tiles later.
#
# ...EXCEPT THAT 3 IS THE ONE WIDTH THAT BREAKS THE SCROLL. The grid may only
# be widened in whole multiples of FOUR tiles per side. See below; we use 4.
#
# THE TILE PATTERN HAS PERIOD 4, AND THE SCROLL WRAP DEPENDS ON IT.
#
# The wallpaper scrolls diagonally: a frame counter at gp+0xBC gives
# s3 = (frames / 4) % 24, subtracted from BOTH the tile X and the tile Y, so
# the sheet drifts up-left one pixel every four frames and wraps every 24 --
# one whole tile. The wrap is meant to be invisible: after sliding a full tile
# up-left, the grid snaps back and, because the pattern repeats, the player
# sees uninterrupted scrolling.
#
# The tile drawn at grid cell (i,j) is tbl[(net*j + 1 + i) % 4], with the
# 4-entry table at 0x80055974 = {0, 2, 1, 3} and `net` = the number of columns
# per row (s2 is bumped once at the row head, once per column, and decremented
# once on loop exit). For the snap-back to be invisible the pattern must be
# invariant under a one-tile diagonal shift -- cell (i-1,j-1) must draw what
# cell (i,j) drew -- which holds if and only if:
#
#   columns per row  ==  3  (mod 4)
#
# Stock is exactly that: x from -0xC to 0x158 step 0x18 = 15 columns, 15 % 4
# == 3. That is not luck, it is the reason those two constants are what they
# are.
#
# Widening by 3 tiles per side gives 21 columns, 21 % 4 == 1 -- so every wrap
# jumped the pattern by two variants and the "endless" scroll visibly reset
# about every 3.2s (96 frames at 30fps). Widening by 4 per side gives 23,
# 23 % 4 == 3, seamless again; and because 4 == 0 (mod 4) the phase at every
# screen position also lands exactly where stock had it, so the 4:3 centre of
# the wallpaper is pixel-identical to the original.
#
# 4 tiles = 96px per side covers the 53px reveal with two columns of overdraw
# on the right and one on the left: 23x11 = 253 rects/frame vs 231. Menu-only,
# irrelevant.
#
# NOTE: not gated on a wide view -- at 4:3 this simply draws a few off-screen
# tiles (wasted, harmless). Gate it before this goes anywhere that ships 4:3.
# Per-object right-edge screen cull. At 0x80018238 the code loads an object's
# X from gp+0x228 and does `slti v0,v0,0x141` (321 = 320+1); if X >= 321 it
# branches past the draw. There is NO matching left-edge test, which is exactly
# why the left margin has always measured far cleaner than the right
# (0.075 vs 0.273 black). This is the cull that makes things pop into view the
# instant they touch the 4:3 edge.
#
# 16:9 reveals 53px on the right, so widen the bound 321 -> 374.
#
# UNVERIFIED. The patch is live in the generated C, but produced no measurable
# change in the test scene (right-margin black stayed 0.273). That scene is
# almost entirely ground and path with few discrete objects near the right
# edge, so this may be correct with nothing to act on -- or it may govern an
# entity class that is not what we are chasing. Retest somewhere with objects
# near the right edge before trusting it.
# ---------------------------------------------------------------------------
# Chunk frustum: DO NOT RELAX -- it CANNOT affect widescreen margins.  SETTLED.
#
# Fully re-investigated 2026-08-13. Every previously recorded reason for this
# verdict was wrong; the verdict itself stands, for a reason nobody had tested.
#
# THE FINDING: relaxing (or widening) the chunk frustum changes ZERO visible
# pixels. The cone is a COARSE PRE-CULL. What actually decides visibility is the
# per-primitive screen-bounds cull in FUN_8001C37C, and [widescreen.cull] below
# ALREADY widens that to the 16:9 frame. So everything visible is drawn already;
# opening the cone only lets more chunks be CONSIDERED, and their primitives are
# then rejected by the bounds test or land off-screen. Pure waste.
#
# PROOF (live A/B on a static scene -- an open dialog box halts the character,
# which is the only way to hold this game still; see the drift warning below):
#   cone delta   gp0_draw/frame   packet buf   margin black L / R
#      +0            408.7           34.0%        0.2770 / 0.1674
#     +20            470.0           40.2%        0.2751 / 0.1674
#     +40            507.5           44.0%        0.2751 / 0.1674
#     +60            579.5           50.8%        0.2751 / 0.1674
#     +80            652.8           57.4%        0.2751 / 0.1674
# +60% draw commands, IDENTICAL margins -- identical to four decimals in all 16
# column bands of the frame. The extra geometry is invisible.
#
# HOW TO TUNE THE CONE LIVE (no rebuild -- use this before ever patching again):
# FUN_8001D348 rebuilds the four plane normals each frame by rotating a base set
# at 0x800A4008 by four angles held in EXE DATA:
#   0x800491E0 = 2156   0x800491E4 = -108   (the two HORIZONTAL planes, +-108)
#   0x800491E8 =   93   0x800491EC = 1962   (the two vertical planes)
# Widen by moving the pair APART (0x800491E0 += d, 0x800491E4 -= d); narrow by
# moving them together. They are re-read from RAM every frame, so `write_ram`
# retunes the cone instantly on a running build. NOTE: a [[recompiler.patch]]
# CANNOT change these -- patches are applied to the image the RECOMPILER
# consumes, while the game reads this data from RAM at runtime. A .psxmod
# package is the only build-time-durable route.
#
# MEASUREMENT TRAPS THAT PRODUCED THREE WRONG VERDICTS -- read before retesting:
#  1. `scene_gpu_ms` was a WHOLE-FRAME SPAN, not GPU busy time. It read 9.084 ms;
#     true scene GPU cost is 0.2-0.8 ms. Fixed in the framework.
#  2. `mirror_gpu_ms` was always 0.000 -- glQueryCounter returns 0 on Apple GL.
#     Now withheld behind `mirror_timing_ok`. Fixed in the framework.
#  3. `prims_avg` COUNTS A NARROWER SUBSET THAN IT APPEARS TO. It FELL 300 -> 199
#     under relaxation while the GPU-side `gpu_state.gp0_draw` ROSE 387 -> 652
#     per frame. Judging by prims_avg says "relaxing destroys geometry" -- false.
#     USE gp0_draw PER FRAME as the geometry metric.
#  4. THE SCENE DRIFTS ON ITS OWN (the character walks, the clock runs, NPCs
#     start dialogs). Wall-clock A/B compares different scenes. Either sample at
#     equal guest frame_count (`freeze_check`), or do what the table above did
#     and measure inside a dialog box, where the world is frozen.
#
# COST, if it were ever wanted: it is affordable but eats the safety margin.
# The primitive packet buffer has NO BOUNDS CHECK -- FUN_8001C37C advances a
# write pointer (ctx+0x118, reset to base ctx+0x124 each frame by FUN_800120C8)
# and never tests the 96000-byte extent at ctx+0x11C. Relaxation takes occupancy
# 34% -> 90%; the old "full bypass" variant (~2.5x again) CRASHED for this
# reason, not for cost. The GPU meanwhile sits at ~7% utilisation and ~34% of
# every frame is the game's own vblank poll at 0x80032CFC.
#
# WHY THE BUFFER CANNOT SIMPLY BE GROWN (FUN_80012598, the allocator):
#   arena      = 0x801BE1B0, memset 0x3EE50 = 257,616 B
#   OT[i]      = arena + i*0x2000 + 0x290       (2 x 8192)
#   packet[i]  = arena + i*96000  + 0x4290      (2 x 96000, size field ctx+0x11C)
# The two packet buffers occupy 0x801C2440..0x801F1240 and aux A starts at
# EXACTLY 0x801F1240 -- the arena is packed with zero slack, so enlarging either
# packet buffer overwrites aux A. Only ~24 KB is free at the arena top
# (0x801F7000..0x801FD000), i.e. ~12 KB per buffer (+12%), and the full-bypass
# variant needs ~2.5x. Relocating the arena wins at most ~108 KB (the gap above
# overlay window B, which ends 0x801A3BE8) -- still far short. Conclusion: the
# full frustum bypass cannot be made memory-safe by enlarging buffers.
#
# RAM layout, read live from both contexts (ctxA 0x8005E5E8, ctxB 0x8005E71C,
# 0x134 apart; DAT_8005E3C0 points at the active one). All CONTIGUOUS:
#   0x801BE440..0x801C0440  OT A            8192 B  (0x800 entries)
#   0x801C0440..0x801C2440  OT B            8192 B
#   0x801C2440..0x801D9B40  packet buf A   96000 B  (base ctx+0x124, len +0x11C)
#   0x801D9B40..0x801F1240  packet buf B   96000 B
#   0x801F1240..0x801F4120  aux buf A      12000 B  (base ctx+0x12C, len +0x128)
#   0x801F4120..0x801F7000  aux buf B      12000 B
#   0x801F7000..0x801FFFF0  stack region (sp base 0x801FFFF0, ~36 KB)
#
# ALSO RULED OUT: the OT index. idx = OTZ>>2 into a 2048-entry table with no
# bound check, and OTZ is unsigned to 65535, so it looked like the culprit. A
# clamp was built and applied at all 8 insert sites (sltiu/bne/addiu into the
# spare nop and the provably-dead negative-rounding path). It changed NOTHING --
# identical gp0_draw, identical image. The surviving plane-3 test already bounds
# Z. Do not spend time here again.
#
# WHERE THE REMAINING MARGIN BLACK ACTUALLY COMES FROM: not this. Look at the
# 2D/sprite layer and the map's own extent instead. Caution when measuring: a
# "black pixel" threshold also counts genuinely dark CONTENT (rocks, water,
# shadow), which is most of the 0.27 figure above -- it is not all missing
# geometry.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Widescreen: WIDEN THE CHUNK FRUSTUM CONE.  [WORKS, BUT d=60 CRASHED -- see below]
#
# !! 2026-08-13: d = 60 OVERRAN the primitive packet buffer in a dense scene
# !! (ctxB 109,840 / 96,000 = 114.4%) and halted with GPU GP0 unknown cmd 0xFC.
# !! The black-tile save peaks at only 54.1%, so it is NOT the worst case.
# !! Stock d=0 already runs ~79% in that dense scene: ~20% headroom total.
# !! Read docs/FRUSTUM.md SS5 before shipping any d.
# !!
# !! MEASURED at the crash spot: stock d=0 is ALREADY 80.9% occupancy; d=+40 hits
# !! 102.7% and dies. Walking at stock peaked 85.2% elsewhere, so no scene is a
# !! safe reference. NO value of d is safe without a hard primitive cap.
# !! THE PATCHES ARE CURRENTLY REMOVED (stock cone, d=0) -- this build is safe.
#
#   >>> FULL GUIDE: docs/FRUSTUM.md  -- read it before changing these. <<<
#
# Removes the black wedges at the left/right edges of the 16:9 frame, at 60 fps.
# It does NOT disable any frustum plane (that was tried; it admits geometry that
# is drawn off-screen and costs far more -- see docs/FRUSTUM.md §6).
#
# ONE TUNABLE, d (shipped: d = 60; stock: d = 0). Benefit SATURATES at 60:
#     angle[0] = 2156 + d   -> patched at 0x8001D45C
#     angle[1] = -108 - d   -> patched at 0x8001D4A4
# Both replacements are `addiu a0,zero,N` = 0x24040000 | (N & 0xFFFF).
# Recompute them, and tune d LIVE via write_ram with no rebuild, using the
# recipes in docs/FRUSTUM.md §1-§2.
#
# These patch the LOADS, not the data: the angles live in EXE data at
# 0x800491E0..EC, which the game reads from RAM at runtime, so a data patch has
# no effect -- [[recompiler.patch]] only edits the image the recompiler consumes.
#
# Measured (black-tile save, stationary, 1280x720): gp0_draw/frame 412 -> 469,
# total_ms 16.667 avg / 17.210 max, scene_gpu 0.463 ms, and the wedge row band
# 1058 -> 21 black px. Watch total_ms_max and the packet-buffer occupancy
# (docs/FRUSTUM.md §5) -- that buffer has NO bounds check.
# ---------------------------------------------------------------------------

[[recompiler.patch]]
id          = "widescreen-object-right-edge-cull"
address     = "0x80018240"
expected    = "0x28420141"   # slti v0,v0,0x141  (321)
replacement = "0x28420176"   # slti v0,v0,0x176  (374 = 321 + 53)
note        = "Right-edge visibility cull: extend to the widescreen frame"

[[recompiler.patch]]
id          = "widescreen-ground-grid-start-x"
address     = "0x80022468"
expected    = "0x2410FFF4"   # addiu s0,zero,-0xC
replacement = "0x2410FF94"   # addiu s0,zero,-0x6C
note        = "Menu wallpaper grid: begin 4 tiles left of the 4:3 edge (4, not 3 -- the pattern has period 4)"

[[recompiler.patch]]
id          = "widescreen-ground-grid-start-x-reset"
address     = "0x800224BC"
expected    = "0x2410FFF4"   # addiu s0,zero,-0xC  (per-row reset, delay slot)
replacement = "0x2410FF94"   # addiu s0,zero,-0x6C
note        = "Same start, reset at the top of each row -- must match the other start exactly"

[[recompiler.patch]]
id          = "widescreen-ground-grid-x-bound"
address     = "0x800224A0"
expected    = "0x2A020158"   # slti v0,s0,0x158  (344 = 320 + one tile)
replacement = "0x2A0201B8"   # slti v0,s0,0x1B8  (440 = 344 + four tiles)
note        = "Menu wallpaper grid: end 4 tiles right of the 4:3 edge -> 23 columns, 23 % 4 == 3, scroll wraps seamlessly"

# ---------------------------------------------------------------------------
# PACKET BUFFER: 96,000 -> 192,000 bytes, by SHARING one buffer between the
# two render contexts instead of double-buffering it.
#
# WHY. The 3D renderer (FUN_8001C37C) advances its write pointer 5-7 words per
# primitive with NO bounds check. At the stock cone the worst measured frame
# used 85.2% of the 96,000-byte buffer; widening the frustum to d=+60 pushes
# that to 104.7% -- it runs off the end into the next context's buffer and the
# GPU is handed garbage ("GP0 unknown command 0xFC"). That is the crash.
#
# WHY THERE IS ROOM. There is none: all 2 MB of PS1 RAM is live. Measured, the
# 107,464-byte hole between the top of overlay window B (0x801A3DE8) and the
# arena base (0x801BE1B0) is NOT free -- it holds sprite tables pointed to from
# 0x80071CA4/0x800781F8/0x80078CF0/0x8007926C, allocated downward from the
# arena base. The largest all-zero run anywhere in RAM is 71,680 bytes.
#
# SO INSTEAD, STOP PAYING FOR DOUBLE BUFFERING. The arena reserves
# base+0x4290 .. base+0x33090 as TWO 96,000-byte packet buffers, one per
# render context. Double buffering exists so the GPU can DMA frame N's packet
# list while the CPU builds frame N+1. In THIS runtime that overlap does not
# exist: linked-list DMA is fully synchronous (psxrecomp/runtime/src/dma.c:700
# -746 walks the whole ordering table and pushes every GP0 word inside the
# store to DMA2's control register), so DrawOTag has entirely consumed the
# buffer before it returns. Pointing both contexts at the same base therefore
# yields one 192,000-byte buffer occupying the exact same bytes -- no
# relocation, no RAM found, no framework change. 104.7% becomes 52.4%.
#
# The ordering tables stay double-buffered (ctx+0x120, stride 0x2000); only the
# primitive arena is shared. Per-frame reset (FUN_800120C8, ctx+0x118 =
# ctx+0x124) rebuilds it from scratch every frame, so nothing persists across
# frames that sharing could destroy.
#
# WHERE. Three init paths, all patched:
#   FUN_8001231C  first loop (stride) then tail-calls FUN_8001E160
#   FUN_80012598  first loop (stride) + its own inlined copy of the second loop
#   FUN_8001E160  the shared second loop
# Each second loop computes ctx+0x124 = arena + 0x4290 + i*96000 with a
# strength-reduced multiply (sll/addu/subu chain, 375<<8). Forcing i*96000 to 0
# collapses that chain to `addu v0,zero,zero` + 6 nops. Verified by scanning
# every branch and jump in the image: nothing targets the interior of either
# chain, so nopping it is safe.
#
# TO RESIZE LATER: the buffer length is ctx+0x11C, set from the "pktbuf-size-*"
# pairs (0x2EE00 = 192,000). The init byte-clear bound "pktbuf-clear-*" must
# stay exactly length-1 (0x2EDFF) or init leaves the tail dirty. The buffer may
# not exceed 0x2EE00 without moving the aux buffers: it starts at arena+0x4290
# and 0x4290 + 0x2EE00 = 0x33090, which is exactly aux buffer A's base.
# Occupancy is (ctx+0x118 - ctx+0x124) / ctx+0x11C -- see docs/FRUSTUM.md section 5.
# ---------------------------------------------------------------------------

[[recompiler.patch]]
id          = "pktbuf-share-stride-a"
address     = "0x800123B0"
expected    = "0x3C160001"
replacement = "0x3C160000"
note        = "lui s6,1 -> lui s6,0   (FUN_8001231C: packet-buffer stride)"

[[recompiler.patch]]
